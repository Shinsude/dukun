# Package manifest. Defines build backend, entry points, and test discovery.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mantra"
version = "0.1.0"
description = "Modular harness for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mantra = "mantra.console:main"
mantra-headless = "mantra.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
